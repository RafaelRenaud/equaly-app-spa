<div class="modal-header">
  <h5 class="modal-title">Sessão prestes a expirar</h5>
</div>
<div class="modal-body text-center">
  Confirmar Reinicialização Automáticada Sessão
  <br /><br />
  <p class="alert alert-warning">
    <i class="bi bi-exclamation-square-fill"></i>
    Sua sessão expirará em <strong>{{ sessionExpiration.minutesLeft() }} {{ sessionExpiration.minutesLeft() === 1 ? "minuto" : "minutos" }}</strong>.
    Você deve confirmar a reinicialização para continuar usando o sistema.
  </p>
  <br />
  <img src="assets/secure_login.svg" class="w-50" alt="Aviso" />
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn btn-primary"
    [disabled]="sessionExpiration.restarting()"
    (click)="sessionExpiration.restart()"
  >
    <i class="bi bi-arrow-repeat"></i>
    Continuar no Sistema
  </button>
</div>
